name: Deploy agent preview site (Azure SWA)

on:
  push:
    branches:
      - agent
  workflow_dispatch:

# One run per branch at a time; a newer push cancels the stale build instead
# of stacking another full deploy behind it.
concurrency:
  group: swa-agent
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://busydadtraining.com
          NEXT_PUBLIC_LISTMONK_URL: https://mail.busydadtraining.com
          NEXT_PUBLIC_LISTMONK_LIST_UUID: ab776f98-a8ae-4e1b-9958-47d4deeefe3d
          NEXT_PUBLIC_BURPEE_HUB_URL: https://api.busydadtraining.com/hubs/burpees
          NEXT_PUBLIC_LEADERBOARD_HUB_URL: https://api.busydadtraining.com/hubs/leaderboard
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_CLIFF_0AD7BD60F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "out"
          api_location: ""
          output_location: ""
          skip_app_build: true
